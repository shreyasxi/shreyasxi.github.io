<!-- Toggle avatar on click/tap (robust path handling, all braces balanced) -->
<script>
(function () {
  try {
    var img = document.querySelector(".author__avatar img, img.u-photo");
    if (!img) {
      console.warn("[avatar-toggle] Avatar <img> not found.");
      return;
    }

    // Values from _config.yml (Liquid injects these)
    var conf1 = "{{ site.author.avatar   | default: '' | strip }}";   // e.g., "graphics.png" or "/images/graphics.png"
    var conf2 = "{{ site.author.avatar_2 | default: '' | strip }}";   // e.g., "graphics2.jpg" or "/images/graphics2.jpg"

    var FALLBACK_1 = "graphics.png";
    var FALLBACK_2 = "graphics2.jpg";

    function joinPath(dir, file) {
      if (!dir.endsWith("/")) dir += "/";
      return dir + file.replace(/^\/+/, "");
    }

    // Determine directory of current avatar shown on page
    var url = new URL(img.src, window.location.origin);
    var parts = url.pathname.split("/");
    var currentFilename = parts.pop() || FALLBACK_1;
    var dirOnPage = parts.join("/") + "/";

    function resolvePath(confValue, fallbackFile) {
      if (confValue && confValue.indexOf("/") !== -1) return confValue; // already a path
      if (confValue) return joinPath(dirOnPage, confValue);             // filename → same dir
      return joinPath(dirOnPage, fallbackFile);
    }

    var src1 = resolvePath(conf1, currentFilename);
    var src2Base = resolvePath(conf2, FALLBACK_2);
    var src2 = src2Base + "?v={{ site.time | date: '%s' }}"; // cache-buster

    var KEY = "avatarVersion";

    function setVer(ver) {
      img.src = ver === "2" ? src2 : src1;
      localStorage.setItem(KEY, ver);
      img.setAttribute("aria-label", ver === "2" ? "Professional photo" : "Casual photo");
      // console logs for debugging
      console.log("[avatar-toggle] set", ver, "→", img.src);
    }

    img.addEventListener("error", function () {
      console.warn("[avatar-toggle] failed to load:", img.src);
    });

    var current = localStorage.getItem(KEY) || "1";
    setVer(current);

    function toggle() {
      current = current === "1" ? "2" : "1";
      setVer(current);
    }

    img.style.cursor = "pointer";
    img.setAttribute("role", "button");
    img.setAttribute("tabindex", "0");
    img.setAttribute("title", "Click to switch photo");

    img.addEventListener("click", toggle);
    img.addEventListener("keypress", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle();
      }
    });

    console.log("[avatar-toggle] dirOnPage:", dirOnPage);
    console.log("[avatar-toggle] src1:", src1);
    console.log("[avatar-toggle] src2:", src2Base);
  } catch (err) {
    console.error("[avatar-toggle] init error:", err);
  }
})();
</script>
