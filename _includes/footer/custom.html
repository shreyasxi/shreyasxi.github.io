<!-- Toggle avatar on click/tap (works with config or filename fallback) -->
<script>
(function () {
  const img = document.querySelector(".author__avatar img, img.u-photo");
  if (!img) {
    console.warn("[avatar-toggle] Avatar <img> not found.");
    return;
  }

  // Values from _config.yml (if present)
  const conf1 = "{{ site.author.avatar   | default: '' | strip }}";   // e.g., "graphics.png" or "/images/graphics.png"
  const conf2 = "{{ site.author.avatar_2 | default: '' | strip }}";   // e.g., "graphics2.jpg" or "/images/graphics2.jpg"

  // Fallback filenames if config isn't set or Liquid didn't resolve
  const FALLBACK_1 = "graphics.png";
  const FALLBACK_2 = "graphics2.jpg";

  function joinPath(dir, file) {
    if (!dir.endsWith("/")) dir += "/";
    return dir + file.replace(/^\/+/, "");
  }

  // Directory of the currently rendered avatar (from the <img src> on the page)
  const url = new URL(img.src, window.location.origin);
  const parts = url.pathname.split("/");
  const currentFilename = parts.pop();     // e.g., "graphics.png"
  const dirOnPage = parts.join("/") + "/"; // e.g., "/images/"

  // Resolve a config value: if it contains '/', treat as path; if just a filename, put in same dir as current avatar
  function resolvePath(confValue, fallbackFile) {
    if (confValue && confValue.includes("/")) return confValue;
    if (confValue) return joinPath(dirOnPage, confValue);
    return joinPath(dirOnPage, fallbackFile);
  }

  // Build src1/src2
  const src1 = resolvePath(conf1, currentFilename || FALLBACK_1);
  const src2Base = resolvePath(conf2, FALLBACK_2);
  const src2 = src2Base + "?v={{ site.time | date: '%s' }}"; // cache-buster

  const KEY = "avatarVersion";

  function set(ver) {
    img.src = ver === "2" ? src2 : src1;
    localStorage.setItem(KEY, ver);
    img.setAttribute("aria-label", ver === "2" ? "Professional photo" : "Casual photo");
    console.log("[avatar-toggle] set", ver, "→", img.src);
  }

  // Debug load failures
  img.addEventListener("error", function () {
    console.warn("[avatar-toggle] failed to load:", img.src);
  });

  // Initialize from previous choice (default to #1)
  let current = localStorage.getItem(KEY) || "1";
  set(current);

  function toggle() {
    current = current === "1" ? "2" : "1";
    set(current);
  }

  // Make it operable & accessible
  img.style.cursor = "pointer";
  img.setAttribute("role", "button");
  img.setAttribute("tabindex", "0");
  img.setAttribute("title", "Click to switch photo");

  img.addEventListener("click", toggle);
  img.addEventListener("keypress", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });

  // Quick log so you know the two targets detected
  console.log("[avatar-toggle] dirOnPage:", dirOnPage);
  console.log("[avatar-toggle] src1:", src1);
  console.log("[avatar-toggle] src2:", src2Base);
})();
</script>
