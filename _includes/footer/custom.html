<!-- Toggle avatar on click/tap (robust path handling) -->
<script>
(function () {
  const img = document.querySelector(".author__avatar img, img.u-photo");
  if (!img) return;

  // Values from _config.yml (Liquid injects these)
  const conf1 = "{{ site.author.avatar   | strip }}";   // e.g., "graphics.png" or "/images/graphics.png"
  const conf2 = "{{ site.author.avatar_2 | strip }}";   // e.g., "graphics2.jpg" or "/images/graphics2.jpg"

  // Helper to join dir + filename safely
  function joinPath(dir, file) {
    if (!dir.endsWith("/")) dir += "/";
    return dir + file.replace(/^\/+/, "");
  }

  // Determine the directory actually used by the current <img src>
  // Example: if src is "https://site.io/repo/images/graphics.png" → dirOnPage = "/repo/images/"
  const url = new URL(img.src, window.location.origin);
  const parts = url.pathname.split("/");
  const filenameOnPage = parts.pop();
  const dirOnPage = parts.join("/") + "/";

  // If config value contains '/', treat as full (site-relative) path; if just a filename, put it in the same dir as the current image
  function resolvePath(confValue, fallbackFile) {
    if (!confValue) return joinPath(dirOnPage, fallbackFile);
    if (confValue.includes("/")) return confValue;      // already a path like "/images/graphics2.jpg"
    return joinPath(dirOnPage, confValue);              // filename → same folder as current avatar
  }

  const src1 = resolvePath(conf1, filenameOnPage);
  const src2NoCache = resolvePath(conf2, filenameOnPage);
  const src2 = src2NoCache + "?v={{ site.time | date: '%s' }}"; // simple cache-buster

  const KEY = "avatarVersion";

  function set(ver) {
    img.src = ver === "2" ? src2 : src1;
    localStorage.setItem(KEY, ver);
    img.setAttribute("aria-label", ver === "2" ? "Professional photo" : "Casual photo");
    console.log("[avatar-toggle] set", ver, "→", img.src);
  }

  // Debug load failures
  img.addEventListener("error", function () {
    console.warn("[avatar-toggle] failed to load:", img.src);
  });

  // Initialize from previous choice (default to #1)
  let current = localStorage.getItem(KEY) || "1";
  set(current);

  function toggle() {
    current = current === "1" ? "2" : "1";
    set(current);
  }

  // Make it operable & accessible
  img.style.cursor = "pointer";
  img.setAttribute("role", "button");
  img.setAttribute("tabindex", "0");
  img.setAttribute("title", "Click to switch photo");

  img.addEventListener("click", toggle);
  img.addEventListener("keypress", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
})();
</script>
