# Site settings. Restart `jekyll serve` after editing this file — it is not reloaded automatically.

locale                   : "en-GB"
title                    : "Shreyas Urgunde"
brand                    : "Personal Website"   # shown top-left in the header; browser tabs keep the title
tagline                  : "Economics & Finance Researcher"
description              : "Economics and finance researcher with an MSc Finance from Warwick Business School, working on empirical finance, econometrics, central bank communication and applied economic analysis."
url                      : "https://shreyasxi.github.io"
baseurl                  : ""
repository               : "shreyasxi/shreyasxi.github.io"

# Used by the header, footer, home page and search/social metadata.
author:
  name                   : "Shreyas Urgunde"
  avatar                 : "/images/prof_pic.jpg"
  bio                    : "Economics & Finance Researcher | MSc Finance, Warwick Business School"
  location               : "United Kingdom"
  email                  : "shreyas.urgunde@warwick.ac.uk"
  linkedin               : "shreyasurgunde"
  github                 : "shreyasxi"
  substack               : "https://economicshub.substack.com"

# Image shown when a page is shared on LinkedIn, WhatsApp, etc.
og_image                 : "/images/prof_pic.jpg"


# Reading files
include:
  - _pages
  - files

exclude:
  # Build and tooling files
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - vendor
  - .bundle
  - .devcontainer
  - .github
  - .sass-cache
  - .jekyll-cache
  - node_modules
  # CV is available on request only
  - files/Shreyas_CV.pdf
  # Leftovers from the Academic Pages template. They are kept in the repository but not
  # published; all of them can be deleted safely.
  - _posts
  - _drafts
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/publications.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - files/bibtex1.bib
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - CONTRIBUTING.md
  - package.json
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/collapse.css
  - assets/css/cv-layout.css
  - assets/css/cv-style.css
  - assets/fonts/academicons.eot
  - assets/fonts/academicons.svg
  - assets/fonts/academicons.ttf
  - assets/fonts/academicons.woff
  - assets/js/_main.js
  - assets/js/collapse.js
  - assets/js/main.min.js
  - assets/js/theme.js
  - assets/js/plugins
  - assets/webfonts
  - images/3953273590_704e3899d5_m.jpg
  - images/500x300.png
  - images/apple-touch-icon-180x180.png
  - images/bio-photo-2.jpg
  - images/bio-photo.jpg
  - images/editing-talk.png
  - images/favicon-192x192.png
  - images/favicon-32x32.png
  - images/favicon-512x512.png
  - images/favicon.ico
  - images/favicon.svg
  - images/foo-bar-identity-th.jpg
  - images/foo-bar-identity.jpg
  - images/homepage.png
  - images/image-alignment-1200x4002.jpg
  - images/image-alignment-150x150.jpg
  - images/image-alignment-300x200.jpg
  - images/image-alignment-580x300.jpg
  - images/manifest.json
  - images/paragraph-indent.png
  - images/paragraph-no-indent.png
  - images/profile.png
  - images/site-logo.png
  - images/themes

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion — keep these as they are: the Macro & RBI Dashboard page depends on them.
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Every page uses the single-column reading layout unless it says otherwise.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single


sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/London

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
