# Site settings. Restart `jekyll serve` after editing this file — it is not reloaded automatically.

locale                   : "en-GB"
title                    : "Shreyas Urgunde"
brand                    : "Personal Website"   # shown top-left in the header; browser tabs keep the title
tagline                  : "Economics & Finance Researcher"
description              : "Economics and finance researcher with an MSc Finance from Warwick Business School, working on empirical finance, econometrics, central bank communication and applied economic analysis."
url                      : "https://shreyasxi.github.io"
baseurl                  : ""
repository               : "shreyasxi/shreyasxi.github.io"

# Used by the header, footer, home page and search/social metadata.
author:
  name                   : "Shreyas Urgunde"
  avatar                 : "/images/prof_pic.jpg"
  bio                    : "Economics & Finance Researcher | MSc Finance, Warwick Business School"
  location               : "United Kingdom"
  email                  : "shreyas.urgunde@warwick.ac.uk"
  linkedin               : "shreyasurgunde"
  github                 : "shreyasxi"
  substack               : "https://economicshub.substack.com"

# Image shown when a page is shared on LinkedIn, WhatsApp, etc.
og_image                 : "/images/prof_pic.jpg"


# Reading files
include:
  - _pages
  - files

exclude:
  # Build and tooling files
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules
  # CV is available on request only
  - files/Shreyas_CV.pdf

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion — keep these as they are: the Macro & RBI Dashboard page depends on them.
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Every page uses the single-column reading layout unless it says otherwise.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single


sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/London

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
